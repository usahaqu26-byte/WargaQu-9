name: Build & Release Android APK (WargaQu)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Package & Release WargaQu APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v5

      - name: 2. Setup Node.js (v22 LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Set up JDK 21 dengan Gradle Cache
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 4. Setup Android SDK Tools & Licenses
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 5. Prepare environment, monotonic build version & signing keystore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          BASE_VERSION=$(node -e "console.log((require('./package.json').version || '1.6.0').trim())")
          BASE_CODE=$(node -e "const fs=require('fs');const t=fs.readFileSync('android/app/build.gradle','utf8');const m=t.match(/WARGAQU_VERSION_CODE[^\"]*\"(\d+)\"/)||t.match(/versionCode\s+(\d+)/);console.log(m?Number(m[1]):5)")
          RUN_NUM="${GITHUB_RUN_NUMBER:-1}"
          BUILD_VERSION_CODE=$((BASE_CODE + RUN_NUM))

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          elif gh release view "v${BASE_VERSION}" >/dev/null 2>&1; then
            RELEASE_TAG="v${BASE_VERSION}-b${RUN_NUM}"
          else
            RELEASE_TAG="v${BASE_VERSION}"
          fi

          echo "APP_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "BUILD_VERSION_CODE=${BUILD_VERSION_CODE}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "WARGAQU_VERSION_NAME=${BASE_VERSION}" >> $GITHUB_ENV
          echo "WARGAQU_VERSION_CODE=${BUILD_VERSION_CODE}" >> $GITHUB_ENV
          echo "VITE_APP_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "VITE_APP_VERSION_CODE=${BUILD_VERSION_CODE}" >> $GITHUB_ENV
          echo "🔧 Release Tag: ${RELEASE_TAG} | Version: ${BASE_VERSION} (Build ${BUILD_VERSION_CODE})"

          mkdir -p ~/.android
          if [ -n "${{ secrets.WARGAQU_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.WARGAQU_KEYSTORE_B64 }}" | base64 -d > android/app/wargaqu-shared-debug.p12
            cp android/app/wargaqu-shared-debug.p12 ~/.android/debug.keystore 2>/dev/null || true
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > android/app/wargaqu-shared-debug.p12
            cp android/app/wargaqu-shared-debug.p12 ~/.android/debug.keystore 2>/dev/null || true
          elif [ -f android/app/wargaqu-shared-debug.p12 ]; then
            echo "✅ Menggunakan wargaqu-shared-debug.p12 permanen (mendukung timpa APK tanpa uninstall)."
            cp android/app/wargaqu-shared-debug.p12 ~/.android/debug.keystore 2>/dev/null || true
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore android/app/wargaqu-shared-debug.p12 -storetype PKCS12 -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=WargaQu Debug,O=WargaQu,C=ID"
            cp android/app/wargaqu-shared-debug.p12 ~/.android/debug.keystore 2>/dev/null || true
          fi

      - name: 6. Install Dependencies & Build Web App
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_APP_VERSION_CODE: ${{ env.VITE_APP_VERSION_CODE }}
        run: |
          npm ci || npm install --legacy-peer-deps
          npm run build
          rm -rf dist/assets/aistudio

      - name: 7. Inisialisasi & Sinkronisasi Platform Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Membuat platform android native via Capacitor..."
            rm -rf android
            npx cap add android
          fi

          rm -rf android/app/src/main/assets/public/assets/aistudio
          echo "Menyinkronkan aset web ke Android..."
          npx cap sync android

          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxActivityVersion = '1.11.0'
              androidxAppCompatVersion = '1.7.1'
              androidxCoordinatorLayoutVersion = '1.3.0'
              androidxCoreVersion = '1.17.0'
              androidxFragmentVersion = '1.8.9'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.14.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.3.0'
              androidxEspressoCoreVersion = '3.7.0'
              cordovaAndroidVersion = '14.0.1'
          }
          EOF

          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          EOF

          sed -i 's/\r$//' android/gradlew 2>/dev/null || true
          chmod +x android/gradlew 2>/dev/null || true
          chmod +x gradlew 2>/dev/null || true

      - name: 8. Build APK with Gradle
        env:
          WARGAQU_VERSION_CODE: ${{ env.WARGAQU_VERSION_CODE }}
          WARGAQU_VERSION_NAME: ${{ env.WARGAQU_VERSION_NAME }}
        run: |
          chmod +x android/gradlew gradlew 2>/dev/null || true
          cd android
          ./gradlew assembleDebug -PversionCodeProp=${WARGAQU_VERSION_CODE} -PversionNameProp=${WARGAQU_VERSION_NAME} --no-daemon --stacktrace -x test -x lint
          cd ..

      - name: 9. Siapkan File APK WargaQu
        run: |
          mkdir -p output-apk
          APP_VERSION="${APP_VERSION:-1.6.0}"
          BUILD_CODE="${BUILD_VERSION_CODE:-5}"
          REL_TAG="${RELEASE_TAG:-v${APP_VERSION}}"
          APK_FILE=""
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "output-apk/WargaQu-${REL_TAG}.apk"
            cp "$APK_FILE" "output-apk/WargaQu-latest.apk"
            PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            printf '{"appId":"com.wargaqu.app","version":"%s","versionCode":%s,"tag":"%s","publishedAt":"%s","apkName":"WargaQu-latest.apk"}\n' \
              "${APP_VERSION}" "${BUILD_CODE}" "${REL_TAG}" "${PUBLISHED_AT}" > output-apk/wargaqu-version.json
            echo "PUBLISHED_AT=${PUBLISHED_AT}" >> $GITHUB_ENV
            echo "========================================="
            echo "✅ APK WargaQu ${REL_TAG} (Build #${BUILD_CODE}) berhasil dibuat"
            ls -lh output-apk/
            sha256sum output-apk/WargaQu-latest.apk
            echo "========================================="
          else
            echo "❌ ERROR: File APK tidak ditemukan di build outputs!"
            find . -name "*.apk" || true
            exit 1
          fi

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: WargaQu-${{ env.RELEASE_TAG }}-APK
          path: output-apk/*
          retention-days: 30

      - name: 11. Terbitkan ke GitHub Releases (Rilis Baru Selalu Jadi Latest)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${RELEASE_TAG:-v${APP_VERSION}}"
          BUILD_CODE="${BUILD_VERSION_CODE:-5}"
          BUILD_TIME_UTC="${PUBLISHED_AT:-$(date -u +"%Y-%m-%dT%H:%M:%SZ")}"
          NOTES="Rilis otomatis WargaQu ${TAG_NAME} (Build #${BUILD_CODE} · ${BUILD_TIME_UTC}). Mendukung pasang timpa APK langsung tanpa uninstall serta versi PWA."

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Menghapus rilis tag duplikat ${TAG_NAME} agar published_at dan --latest diperbarui segar..."
            gh release delete "${TAG_NAME}" --yes --cleanup-tag || true
            sleep 2
          fi

          for attempt in 1 2 3; do
            if gh release create "${TAG_NAME}" \
              "output-apk/WargaQu-${TAG_NAME}.apk" \
              "output-apk/WargaQu-latest.apk" \
              "output-apk/wargaqu-version.json" \
              --target "${{ github.sha }}" \
              --title "WargaQu ${TAG_NAME} (Build #${BUILD_CODE})" \
              --notes "${NOTES}" \
              --latest; then
              exit 0
            fi
            echo "Percobaan rilis ke-${attempt} gagal, mencoba ulang dalam 5 detik..."
            sleep 5
          done
          exit 1

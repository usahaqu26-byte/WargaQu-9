name: Build & Release Android APK (WargaQu)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Package & Release WargaQu APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Set up JDK 21 dengan Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 4. Setup Android SDK Tools & Licenses
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 5. Prepare environment and debug keystore
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=WargaQu Debug,O=WargaQu,C=ID"
            cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true
          fi

      - name: 6. Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 7. Inisialisasi & Sinkronisasi Platform Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Membuat platform android native via Capacitor..."
            rm -rf android
            npx cap add android
          fi

          echo "Menyinkronkan aset web ke Android..."
          npx cap sync android

          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 35
              targetSdkVersion = 35
              androidxActivityVersion = '1.9.3'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.15.0'
              androidxFragmentVersion = '1.8.5'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.12.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '14.0.1'
          }
          EOF

          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          android.enableJetifier=true
          android.builder.sdkDownload=true
          EOF

          chmod +x android/gradlew 2>/dev/null || true
          chmod +x gradlew 2>/dev/null || true

      - name: 8. Build APK with Gradle
        run: |
          chmod +x android/gradlew gradlew 2>/dev/null || true
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          cd ..

      - name: 9. Siapkan File APK WargaQu
        run: |
          mkdir -p output-apk
          APP_VERSION=$(node -e "console.log(require('./package.json').version || '1.5.7')")
          APK_FILE=""
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "output-apk/WargaQu-v${APP_VERSION}.apk"
            cp "$APK_FILE" "output-apk/WargaQu-latest.apk"
            echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
            echo "========================================="
            echo "✅ APK WargaQu v${APP_VERSION} berhasil dibuat"
            ls -lh output-apk/
            sha256sum output-apk/WargaQu-latest.apk
            echo "========================================="
          else
            echo "❌ ERROR: File APK tidak ditemukan di build outputs!"
            find . -name "*.apk" || true
            exit 1
          fi

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WargaQu-v${{ env.APP_VERSION }}-APK
          path: output-apk/*.apk
          retention-days: 30

      - name: 11. Terbitkan ke GitHub Releases (Unduhan Publik Langsung)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v${APP_VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          NOTES="Rilis otomatis WargaQu ${TAG_NAME} (Android APK). Tersedia juga versi PWA & halaman pratinjau via GitHub Pages."
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "output-apk/WargaQu-v${APP_VERSION}.apk" "output-apk/WargaQu-latest.apk" --clobber
          else
            gh release create "${TAG_NAME}" \
              "output-apk/WargaQu-v${APP_VERSION}.apk" \
              "output-apk/WargaQu-latest.apk" \
              --title "WargaQu ${TAG_NAME}" \
              --notes "${NOTES}" \
              --latest
          fi

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v5

      - name: 2. Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: 4. Build Vite PWA Application
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: |
          APP_VER=$(node -e "console.log((require('./package.json').version || '1.6.0').trim())")
          VITE_APP_VERSION="${APP_VER}" npm run build
          rm -rf dist/assets/aistudio
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          ls -la dist/

      - name: 5. Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: 6. Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
